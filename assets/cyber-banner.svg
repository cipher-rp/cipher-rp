<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">Pradeep Kumar — Cybersecurity SOC Analyst</title>
  <desc id="desc">Cybersecurity themed terminal and security operations banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#081a2b"/>
      <stop offset="100%" stop-color="#031014"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18334a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="380" rx="24" fill="url(#grid)" opacity=".55"/>

  <circle cx="1110" cy="70" r="150" fill="#00e5ff" opacity=".09" filter="url(#blur)"/>
  <circle cx="1180" cy="300" r="170" fill="#7c3aed" opacity=".09" filter="url(#blur)"/>

  <g transform="translate(85 72)">
    <rect width="620" height="220" rx="18" fill="#030712" stroke="#1f3b53" stroke-width="2"/>
    <circle cx="28" cy="25" r="6" fill="#00e5ff"/>
    <circle cx="50" cy="25" r="6" fill="#7c3aed"/>
    <circle cx="72" cy="25" r="6" fill="#334155"/>

    <text x="28" y="68" fill="#64748b" font-family="monospace" font-size="16">$ whoami</text>
    <text x="28" y="96" fill="#e2e8f0" font-family="monospace" font-size="22">pradeep@secops:~$</text>
    <text x="28" y="130" fill="#00e5ff" font-family="monospace" font-size="18">SOC Analyst L1</text>
    <text x="28" y="158" fill="#94a3b8" font-family="monospace" font-size="15">threat_detection • incident_response</text>
    <text x="28" y="184" fill="#94a3b8" font-family="monospace" font-size="15">wazuh • splunk • snort • mitre_attack</text>
  </g>

  <g transform="translate(805 62)">
    <path d="M160 0 L292 48 L275 188 C262 248 211 283 160 304 C109 283 58 248 45 188 L28 48 Z"
          fill="#071725" stroke="url(#glow)" stroke-width="5"/>
    <path d="M160 45 L242 75 L230 172 C220 216 190 239 160 255 C130 239 100 216 90 172 L78 75 Z"
          fill="none" stroke="#00e5ff" stroke-width="2" opacity=".65"/>
    <circle cx="160" cy="128" r="40" fill="none" stroke="#7c3aed" stroke-width="4"/>
    <path d="M138 130 L153 145 L185 108" fill="none" stroke="#00e5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="337" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="15">DETECT • HUNT • RESPOND</text>
  </g>

  <path d="M0 340 H1400" stroke="url(#glow)" stroke-width="2" opacity=".8"/>
</svg>
